name: CI

on: [push, pull_request]

jobs:
  backend:
    name: Backend (check, lint, test, build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: classhub
          POSTGRES_PASSWORD: classhub
          POSTGRES_DB: classhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U classhub"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://classhub:classhub@localhost:5432/classhub
      JWT_SECRET: chave-de-teste-ci
      CLIENT_URL: http://localhost:5173
    defaults:
      run:
        working-directory: classhub_work/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: classhub_work/backend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run db:init
      - run: npm test
      - run: npm run build

  frontend:
    name: Frontend (check, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: classhub_work/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: classhub_work/frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build
