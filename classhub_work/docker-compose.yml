services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: classhub
      POSTGRES_PASSWORD: classhub
      POSTGRES_DB: classhub
    volumes:
      - pgdata:/var/lib/postgresql/data
      # schema + seed rodam automaticamente na PRIMEIRA inicialização (volume vazio)
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classhub -d classhub"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://classhub:classhub@db:5432/classhub
      JWT_SECRET: ${JWT_SECRET:-troque-esta-chave-em-producao}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:8080}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
  uploads:
